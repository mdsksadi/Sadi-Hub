name: Publish scheduled posts

on:
  schedule:
    # Supabase-side publish; no Worker cron or long-lived browser session needed.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish due scheduled posts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are required"
            exit 1
          fi
          status=$(curl -sS -o /tmp/publish-response.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/publish_due_posts_for_cron" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Publish RPC failed with HTTP $status"
            head -c 500 /tmp/publish-response.json || true
            exit 1
          fi
          echo "Scheduled publishing check complete (HTTP $status)"
